<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machine Learning — Laboratorio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{--bg:#0B0F19;--bg2:#141A26;--accent:#00B5C5;--fog:#82A0AA;--mint2:#45DCC6;--text:#FFFFFF;--muted:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Outfit',sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1920px;height:1080px;background:radial-gradient(1100px 700px at 50% 12%, #1C2532 0%, var(--bg) 68%);overflow:hidden;display:flex;align-items:center;justify-content:center}
.header{position:absolute;top:44px;left:50%;transform:translateX(-50%);text-align:center;z-index:6}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(0,181,197,.14);border:1px solid rgba(0,181,197,.38);color:var(--accent);font-size:11px;letter-spacing:1.4px;font-weight:700}
.header h1{font-size:46px;font-weight:800;color:#fff;margin-top:14px;letter-spacing:-1px}
.header p{font-size:15px;color:var(--muted);margin-top:8px}
.center{position:relative;display:flex;align-items:center;gap:54px;z-index:3}
.petri-wrap{position:relative;width:400px;height:400px;border-radius:50%;background:radial-gradient(ellipse at 30% 28%, #1E2A3A 0%, #111827 58%, #0B0F19 100%);border:2px solid rgba(255,255,255,.10);box-shadow:0 22px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.08), 0 0 0 10px rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;overflow:hidden}
.petri-wrap::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(0,181,197,.14);pointer-events:none}
.petri-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle, rgba(0,181,197,.22) 0%, transparent 62%);filter:blur(8px);opacity:.9}
.dot{position:absolute;width:18px;height:18px;border-radius:50%;box-shadow:0 0 14px rgba(0,181,197,.45), 0 2px 8px rgba(0,0,0,.35)}
.dot.mint{background:var(--accent)}
.dot.fog{background:var(--fog)}
.dot.mint2{background:var(--mint2)}
.dot.white{background:#E8F4F6}
.cluster-label{position:absolute;font-size:10px;letter-spacing:1.0px;font-weight:700;text-transform:uppercase;color:var(--muted);opacity:0}
.cluster-label.a{top:34px;left:62px}
.cluster-label.b{bottom:42px;right:58px}
.progress-vertical{position:relative;width:18px;height:360px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.25);display:flex;align-items:flex-end;padding:3px}
.progress-fill{width:100%;height:0%;background:linear-gradient(180deg, var(--mint2) 0%, var(--accent) 100%);border-radius:999px;box-shadow:0 0 12px rgba(0,181,197,.45)}
.progress-v-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1px;font-weight:700;color:var(--muted);white-space:nowrap;text-transform:uppercase}
.bg-grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);background-size:52px 52px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg-grid"></div>
  <div class="header">
    <div class="badge">Módulo 04 — Laboratorio</div>
    <h1>Machine Learning</h1>
    <p>Agrupar para entender</p>
  </div>
  <div class="center" id="center">
    <div class="petri-wrap" id="petri">
      <div class="petri-glow" id="glow"></div>
      <div class="cluster-label a" id="labelA">Cluster A</div>
      <div class="cluster-label b" id="labelB">Cluster B</div>
    </div>
    <div style="position:relative">
      <div class="progress-v-label">Progreso</div>
      <div class="progress-vertical"><div class="progress-fill" id="vFill"></div></div>
    </div>
  </div>
</div>
<script>
window.DURATION=6;
const petri=document.getElementById('petri');
const glow=document.getElementById('glow');
const vFill=document.getElementById('vFill');
const labelA=document.getElementById('labelA');
const labelB=document.getElementById('labelB');
// 8 dots: initial scattered, final 2 clusters
const dots=[];
const colors=['mint','fog','mint2','white','mint','fog','mint','mint2'];
// center 200,200
const startPos=[
  {x:68,y:72},{x:312,y:68},{x:92,y:298},{x:288,y:312},{x:172,y:42},{x:208,y:328},{x:42,y:168},{x:338,y:192}
];
const endPos=[
  {x:132,y:132},{x:118,y:168},{x:152,y:148},{x:142,y:178}, // cluster A near 130,150
  {x:262,y:232},{x:278,y:268},{x:248,y:268},{x:268,y:248}  // cluster B near 265,255
];
colors.forEach((c,i)=>{
  const d=document.createElement('div');
  d.className='dot '+c;
  d.id='dot'+i;
  petri.appendChild(d);
  dots.push(d);
});
window.seek=function(t){
  t=Math.max(0,Math.min(window.DURATION,t));
  // vFill 0-3.2s
  const pk=Math.min(1,t/3.2);
  const e=1-Math.pow(1-pk,3);
  vFill.style.height=(e*100)+'%';
  // glow pulse
  const gp = 0.85 + Math.sin(t*1.6)*0.08;
  glow.style.transform='scale('+gp+')';
  glow.style.opacity=(0.55+Math.sin(t*1.1)*0.12).toFixed(2);
  // dots cluster 0-3s
  const k=Math.min(1,t/2.9);
  const ek=1-Math.pow(1-k,4);
  dots.forEach((el,i)=>{
    const s=startPos[i], epos=endPos[i];
    const x=s.x + (epos.x - s.x)*ek;
    const y=s.y + (epos.y - s.y)*ek;
    // add subtle orbit after cluster 3-6s
    const flo = t>2.9 ? Math.sin(t*1.9 + i)*1.6 : 0;
    el.style.left=(x-9+flo)+'px';
    el.style.top=(y-9)+'px';
    el.style.opacity=(0.55+ek*0.45).toFixed(2);
    el.style.transform='scale('+(0.88+ek*0.18)+')';
  });
  // labels fade in 2.2-3.0s
  const lk=Math.max(0,Math.min(1,(t-2.15)/0.9));
  labelA.style.opacity=lk.toFixed(2);
  labelB.style.opacity=lk.toFixed(2);
  // ring pulse between clusters (draw via glow intensity already)
  const hdr=document.querySelector('.header');
  if(hdr){ hdr.style.opacity=(Math.min(1,t/0.85)).toFixed(2); }
};
let s=null;
function loop(ts){ if(s===null) s=ts; window.seek(((ts-s)/1000)%window.DURATION); requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script src="/animations/bridge.js"></script>
</body>
</html>
