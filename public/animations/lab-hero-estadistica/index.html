<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadística — Laboratorio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{--bg:#F4F6F8;--accent:#00B5C5;--fog:#82A0AA;--text:#2A272A;--muted:#677381}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Outfit',sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1920px;height:1080px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.header{position:absolute;top:46px;left:50%;transform:translateX(-50%);text-align:center;z-index:5}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(0,181,197,.10);border:1px solid rgba(0,181,197,.28);color:var(--accent);font-size:11px;letter-spacing:1.4px;font-weight:700}
.header h1{font-size:46px;font-weight:800;color:var(--text);margin-top:14px;letter-spacing:-1px}
.header p{font-size:16px;color:var(--muted);margin-top:8px}
.lab-row{display:flex;align-items:flex-end;gap:22px;margin-top:18px;position:relative}
.beaker{position:relative;width:62px;height:110px;background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(238,244,246,.9) 100%);border:1px solid rgba(42,39,42,.12);border-radius:0 0 14px 14px;box-shadow:0 10px 22px rgba(42,39,42,.10), inset 0 2px 0 rgba(255,255,255,.9)}
.beaker::before{content:"";position:absolute;top:-6px;left:-3px;right:-3px;height:10px;background:#FFFFFF;border:1px solid rgba(42,39,42,.10);border-radius:6px}
.beaker-fill{position:absolute;bottom:0;left:1px;right:1px;height:0;background:linear-gradient(180deg, rgba(0,181,197,.55) 0%, rgba(0,181,197,.22) 100%);border-radius:0 0 12px 12px}
.chart-area{position:relative;width:560px;height:220px;background:#FFFFFF;border:1px solid rgba(42,39,42,.10);border-radius:18px;box-shadow:0 12px 32px rgba(42,39,42,.08);padding:18px 18px 14px;display:flex;flex-direction:column}
.chart-title{font-size:11px;letter-spacing:1.1px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.bars{flex:1;display:flex;align-items:flex-end;gap:14px;padding:0 10px}
.bar{flex:1;background:linear-gradient(180deg, var(--accent) 0%, #0AA3B0 100%);border-radius:10px 10px 6px 6px;min-height:6px;box-shadow:0 6px 14px rgba(0,181,197,.22);transform-origin:bottom}
.bar.fog{background:linear-gradient(180deg, #82A0AA 0%, #5A7A84 100%);box-shadow:0 6px 14px rgba(130,160,170,.22)}
.bar.mint2{background:linear-gradient(180deg, #45DCC6 0%, #00B5C5 100%)}
.axis{height:1px;background:rgba(42,39,42,.12);margin-top:10px}
.curve-svg{position:absolute;inset:18px 18px 24px 18px;pointer-events:none;overflow:visible}
.curve-path{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(0,181,197,.35));stroke-dasharray:620;stroke-dashoffset:620}
.measures{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.measure-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(0,181,197,.45)}
.measure-line{width:42px;height:2px;background:linear-gradient(90deg, var(--accent), transparent);border-radius:999px;opacity:.55}
.bg-orb{position:absolute;width:860px;height:860px;border-radius:50%;background:radial-gradient(circle, rgba(0,181,197,.08) 0%, transparent 70%);top:52%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg-orb"></div>
  <div class="header">
    <div class="badge">Módulo 03 — Laboratorio</div>
    <h1>Estadística</h1>
    <p>Mediciones que revelan la distribución</p>
  </div>
  <div class="lab-row" id="labRow">
    <div class="beaker"><div class="beaker-fill" id="bf0"></div></div>
    <div class="beaker"><div class="beaker-fill" id="bf1" style="background:linear-gradient(180deg, rgba(130,160,170,.55) 0%, rgba(130,160,170,.20) 100%)"></div></div>
    <div class="beaker"><div class="beaker-fill" id="bf2"></div></div>
    <div class="chart-area" id="chart">
      <div class="chart-title">Distribución — histograma y curva normal</div>
      <div class="bars" id="bars">
        <div class="bar" id="bar0" style="height:42%"></div>
        <div class="bar fog" id="bar1" style="height:68%"></div>
        <div class="bar" id="bar2" style="height:88%"></div>
        <div class="bar fog" id="bar3" style="height:62%"></div>
        <div class="bar mint2" id="bar4" style="height:38%"></div>
      </div>
      <div class="axis"></div>
      <svg class="curve-svg" viewBox="0 0 520 160" preserveAspectRatio="none">
        <path id="curve" class="curve-path" d="M 10 138 C 72 138, 112 42, 188 28 C 264 14, 312 38, 360 78 C 408 118, 452 138, 510 138" />
      </svg>
    </div>
  </div>
  <div class="measures" id="measures"><span class="measure-dot"></span><span class="measure-line"></span><span class="measure-dot" style="background:var(--fog)"></span><span class="measure-line" style="background:linear-gradient(90deg,var(--fog),transparent)"></span><span class="measure-dot" style="background:#45DCC6"></span></div>
</div>
<script>
window.DURATION=6;
const bars=[0,1,2,3,4].map(i=>document.getElementById('bar'+i));
const beakers=[0,1,2].map(i=>document.getElementById('bf'+i));
const curve=document.getElementById('curve');
const totalLen=620;
window.seek=function(t){
  t=Math.max(0,Math.min(window.DURATION,t));
  // beakers fill 0-1.0s
  beakers.forEach((el,i)=>{
    const d=i*0.18;
    const k=Math.max(0,Math.min(1,(t-d)/0.75));
    const e=1-Math.pow(1-k,3);
    const hs=[58,72,46];
    el.style.height=(e*hs[i])+'%';
  });
  // bars rise staggered 0.6-2.2s
  const targets=[42,68,88,62,38];
  bars.forEach((el,i)=>{
    const st=0.55 + i*0.22;
    const k=Math.max(0,Math.min(1,(t-st)/0.85));
    const e=1-Math.pow(1-k,3);
    const scale=e;
    el.style.transform='scaleY('+scale+')';
    el.style.opacity=(0.35+scale*0.65).toFixed(2);
    // keep height via scaleY, so preserve layout height
  });
  // curve draws 1.8-3.6s
  const ck=Math.max(0,Math.min(1,(t-1.7)/1.9));
  const ce=1-Math.pow(1-ck,3);
  const offset=totalLen*(1-ce);
  curve.style.strokeDashoffset=offset.toFixed(1);
  curve.style.opacity=(ck>0?1:0);
  // header in
  const hdr=document.querySelector('.header');
  if(hdr){ hdr.style.opacity=(Math.min(1,t/0.85)).toFixed(2); hdr.style.transform='translateX(-50%) translateY('+(10*(1-Math.min(1,t/0.85)))+'px)';}
  // measures pulse 2.8-6s
  const meas=document.getElementById('measures');
  if(meas){ meas.style.opacity=(0.0+Math.min(1, Math.max(0,(t-2.2)/0.8))).toFixed(2); }
};
bars.forEach(b=>{ b.style.transform='scaleY(0)';});
curve.style.strokeDasharray=totalLen;
curve.style.strokeDashoffset=totalLen;
let s=null;
function loop(ts){ if(s===null) s=ts; window.seek(((ts-s)/1000)%window.DURATION); requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script src="/animations/bridge.js"></script>
</body>
</html>
