<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python para Biotecnología — Laboratorio</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{--bg:#1A1E26;--bg2:#242A36;--accent:#00B5C5;--accent2:#45DCC6;--fog:#82A0AA;--text:#FFFFFF;--muted:#9AA8B5;--card:#FFFFFF;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Outfit',sans-serif}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:1920px;height:1080px;background:radial-gradient(1200px 700px at 50% 0%, #2A3342 0%, var(--bg) 62%);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.header{position:absolute;top:46px;left:50%;transform:translateX(-50%);text-align:center;z-index:5}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(0,181,197,.14);border:1px solid rgba(0,181,197,.38);color:var(--accent);font-size:11px;letter-spacing:1.4px;font-weight:700}
.header h1{font-size:44px;font-weight:800;color:#fff;margin-top:14px;letter-spacing:-1px}
.header p{font-size:15px;color:var(--muted);margin-top:8px}
.bench{position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(180deg, #2A3342 0%, #1E242E 100%);border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;gap:28px;padding-bottom:34px}
.tube{position:relative;width:84px;height:148px;background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.78) 100%);border:1px solid rgba(255,255,255,.22);border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.38), inset 0 2px 0 rgba(255,255,255,.9)}
.tube::before{content:"";position:absolute;top:-8px;left:-4px;right:-4px;height:14px;background:#E8ECF0;border-radius:8px;border:1px solid rgba(0,0,0,.10)}
.tube-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(180deg, var(--accent) 0%, #0AA3B0 100%);border-radius:0 0 22px 22px;box-shadow:0 0 16px rgba(0,181,197,.45), inset 0 2px 8px rgba(255,255,255,.22)}
.tube-fill.fog{background:linear-gradient(180deg, #82A0AA 0%, #5A7A84 100%)}
.tube-fill.mint2{background:linear-gradient(180deg, #45DCC6 0%, #00B5C5 100%)}
.tube-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.9px;font-weight:700;color:var(--muted);white-space:nowrap}
.code-area{position:relative;z-index:3;display:flex;align-items:center;gap:26px;margin-bottom:42px}
.code-card{width:420px;height:148px;background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.code-card pre{font-family:'JetBrains Mono',monospace;font-size:22px;color:#E8F4F6;line-height:1.3}
.code-card .accent{color:var(--accent)}
.code-card .muted{color:var(--fog)}
.brackets{font-size:64px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:2px;filter:drop-shadow(0 0 12px rgba(0,181,197,.45))}
.pipette{position:relative;width:92px;height:144px;display:flex;flex-direction:column;align-items:center}
.pipette-body{width:30px;height:92px;background:linear-gradient(180deg, #E8ECF0 0%, #CBD6DE 100%);border-radius:10px;border:1px solid rgba(0,0,0,.12);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.pipette-tip{width:14px;height:28px;background:linear-gradient(180deg, #00B5C5 0%, #008DBF 100%);clip-path:polygon(20% 0, 80% 0, 100% 100%, 0 100%);margin-top:-2px}
.pipette-bulb{width:34px;height:22px;background:#FFFFFF;border-radius:10px 10px 6px 6px;border:1px solid rgba(0,0,0,.10);margin-bottom:4px}
.drop{position:absolute;width:14px;height:14px;background:var(--accent);border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;top:138px;left:50%;transform:translateX(-50%);opacity:0;box-shadow:0 0 10px rgba(0,181,197,.6)}
.bg-grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);background-size:48px 48px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg-grid"></div>
  <div class="header">
    <div class="badge">Módulo 02 — Laboratorio</div>
    <h1>Python para Biotecnología</h1>
    <p>Código que se vuelve muestra</p>
  </div>
  <div class="code-area" id="codeArea">
    <div class="code-card" id="codeCard"><pre><span class="muted">import</span> <span class="accent">bioseq</span>
<span class="muted">for</span> s <span class="muted">in</span> muestras:
  <span class="accent">analizar</span>(s)</pre></div>
    <div class="brackets" id="brackets">{&nbsp;}</div>
    <div class="pipette" id="pipette">
      <div class="pipette-bulb"></div>
      <div class="pipette-body"></div>
      <div class="pipette-tip"></div>
      <div class="drop" id="drop"></div>
    </div>
  </div>
  <div class="bench" id="bench">
    <div class="tube"><div class="tube-fill" id="fill0"></div><div class="tube-label">Muestra A</div></div>
    <div class="tube"><div class="tube-fill fog" id="fill1"></div><div class="tube-label">Muestra B</div></div>
    <div class="tube"><div class="tube-fill mint2" id="fill2"></div><div class="tube-label">Muestra C</div></div>
    <div class="tube"><div class="tube-fill" id="fill3"></div><div class="tube-label">Muestra D</div></div>
  </div>
</div>
<script>
window.DURATION=6;
const fills=[0,1,2,3].map(i=>document.getElementById('fill'+i));
const brackets=document.getElementById('brackets');
const codeCard=document.getElementById('codeCard');
const pipette=document.getElementById('pipette');
const drop=document.getElementById('drop');
window.seek=function(t){
  t=Math.max(0,Math.min(window.DURATION,t));
  // brackets morph: scale + glow 0-1.2s
  const kb=Math.min(1,t/1.2);
  const ek=1-Math.pow(1-kb,3);
  brackets.style.transform='scale('+(0.88+ek*0.18)+')';
  brackets.style.opacity=(0.25+ek*0.75).toFixed(2);
  codeCard.style.opacity=(0.0+Math.min(1,t/0.7)).toFixed(2);
  codeCard.style.transform='translateY('+(10*(1-Math.min(1,t/0.7)))+'px)';
  // pipette aspirate: 0.6-1.6s slight scale
  const pipK = t<0.6?0 : t<1.6 ? (t-0.6)/1.0 : t<3.0 ? 1 - (t-1.6)/1.4*0.15 : 0.85;
  pipette.style.transform='translateY('+( -6 * Math.min(1,Math.max(0,(t-0.8)/0.8)) )+'px) scale('+(1+Math.max(0,pipK)*0.04)+')';
  // drop falls 1.1-1.7s
  if(t>=1.05 && t<=1.75){
    const dk=(t-1.05)/0.7;
    drop.style.opacity='1';
    drop.style.transform='translateX(-50%) translateY('+(dk*68)+'px) scale('+(1 - dk*0.15)+')';
  } else if(t>1.75){
    drop.style.opacity='0';
  } else { drop.style.opacity='0';}
  // tubes fill staggered 0-3s
  fills.forEach((el,i)=>{
    const st=1.45 + i*0.42;
    const dur=0.95;
    let k=0;
    if(t>=st) k=Math.min(1,(t-st)/dur);
    const e=1-Math.pow(1-k,3);
    // fill heights 62,78,54,72%
    const targets=[62,78,54,72];
    el.style.height=(e*targets[i])+'%';
    el.style.opacity=(0.7+e*0.3).toFixed(2);
  });
  // bench subtle in
  const bench=document.getElementById('bench');
  if(bench){ bench.style.opacity=(0.0+Math.min(1,t/0.8)).toFixed(2); }
};
let s=null;
function loop(ts){ if(s===null) s=ts; window.seek(((ts-s)/1000)%window.DURATION); requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script src="/animations/bridge.js"></script>
</body>
</html>
