<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Cinematic Scientific Laboratory Background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="viewport">
  <div id="stage">

    <!-- LAYER 1: Base background image with tinted overlay -->
    <div class="layer" id="bg-base" data-layer="Base Background" data-anim="background">
      <img src="assets/landing-background.png" alt="" class="bg-img" aria-hidden="true">
      <div class="bg-tint"></div>
    </div>

    <!-- LAYER 2: Subtle tech grid overlay -->
    <div class="layer" id="grid-overlay" data-layer="Grid Overlay" data-anim="grid" aria-hidden="true"></div>

    <!-- LAYER 3: Ambient glow orbs (deterministic, driven by t) -->
    <div class="layer" id="ambient-orbs" data-layer="Ambient Orbs" data-anim="orbs" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- LAYER 4: DNA Double Helix (SVG, left side) -->
    <div class="layer" id="dna-container" data-layer="DNA Helix" data-anim="dna">
      <svg id="dna-helix" viewBox="0 0 300 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <filter id="helix-glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <linearGradient id="strand-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00b2b2" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#00d4d4" stop-opacity="1"/>
            <stop offset="100%" stop-color="#00b2b2" stop-opacity="0.9"/>
          </linearGradient>
          <linearGradient id="rung-grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00b2b2" stop-opacity="0.6"/>
            <stop offset="50%" stop-color="#00ffff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#00b2b2" stop-opacity="0.6"/>
          </linearGradient>
        </defs>
        <g id="helix-group">
          <!-- Generated by timeline.js -->
        </g>
      </svg>
    </div>

    <!-- LAYER 5: Floating particles canvas -->
    <canvas id="particles-canvas" class="layer" data-layer="Particles" data-anim="particles" aria-hidden="true"></canvas>

    <!-- LAYER 6: Glass Panel 1 — Bar Chart (left area) -->
    <div class="layer" id="panel-chart" data-layer="Chart Panel" data-anim="chart-panel">
      <div class="glass-panel">
        <div class="panel-header">
          <span class="panel-dot"></span>
          <span class="panel-title">GENOMIC ANALYSIS</span>
        </div>
        <div class="panel-body">
          <svg id="bar-chart" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet">
            <!-- Generated by timeline.js -->
          </svg>
          <div class="chart-labels">
            <span>A</span><span>C</span><span>G</span><span>T</span><span>A</span><span>C</span><span>G</span><span>T</span>
          </div>
        </div>
        <div class="panel-footer">
          <span class="metric-val" id="metric-seq">98.7%</span>
          <span class="metric-label">SEQUENCE MATCH</span>
        </div>
      </div>
    </div>

    <!-- LAYER 7: Glass Panel 2 — Metrics (center-right) -->
    <div class="layer" id="panel-metrics" data-layer="Metrics Panel" data-anim="metrics-panel">
      <div class="glass-panel glass-panel-wide">
        <div class="panel-header">
          <span class="panel-dot dot-teal"></span>
          <span class="panel-title">NEURAL PROCESSING</span>
        </div>
        <div class="panel-body metrics-grid">
          <div class="metric-block">
            <div class="metric-val tnum" id="metric-1">2,847</div>
            <div class="metric-label">ACTIVE NODES</div>
          </div>
          <div class="metric-block">
            <div class="metric-val tnum" id="metric-2">14.3ms</div>
            <div class="metric-label">AVG LATENCY</div>
          </div>
          <div class="metric-block">
            <div class="metric-val tnum" id="metric-3">99.2%</div>
            <div class="metric-label">ACCURACY</div>
          </div>
        </div>
        <div class="panel-footer">
          <div class="mini-chart" id="mini-chart-1">
            <!-- Mini sparkline generated by timeline.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- LAYER 8: Glass Panel 3 — Data Feed (bottom-right) -->
    <div class="layer" id="panel-feed" data-layer="Feed Panel" data-anim="feed-panel">
      <div class="glass-panel glass-panel-sm">
        <div class="panel-header">
          <span class="panel-dot dot-cyan"></span>
          <span class="panel-title">SIGNAL FEED</span>
        </div>
        <div class="panel-body">
          <div class="feed-items" id="feed-items">
            <!-- Generated by timeline.js -->
          </div>
        </div>
      </div>
    </div>

    <!-- LAYER 9: Neural Network SVG (right side) -->
    <div class="layer" id="neural-network" data-layer="Neural Network" data-anim="neural-net">
      <svg id="nn-svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <filter id="node-glow">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="node-glow-strong">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g id="nn-connections"></g>
        <g id="nn-nodes"></g>
      </svg>
    </div>

    <!-- LAYER 10: Holographic scan line -->
    <div class="layer" id="scan-line" data-layer="Scan Line" data-anim="scan" aria-hidden="true"></div>

    <!-- LAYER 11: Vignette -->
    <div class="layer" id="vignette" data-layer="Vignette" aria-hidden="true"></div>

    <!-- LAYER 12: Film grain overlay -->
    <div class="layer" id="grain" data-layer="Film Grain" aria-hidden="true"></div>

  </div><!-- /stage -->
</div><!-- /viewport -->

<!-- Playback controls -->
<div class="playback" id="playback">
  <button id="playbtn" title="Play / Pause (Space)" aria-label="Play / Pause">&#9654;</button>
  <div class="tc" id="tc">00:00 / 00:30</div>
</div>

<script src="timeline.js"></script>
  <script src="/animations/bridge.js"></script>
</body>
</html>
