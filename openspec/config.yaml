# openspec/config.yaml
schema: spec-driven

project: invitro-code
stack: nextjs-16-typescript-tailwind-v4
language: spanish
strict_tdd: false

context: |
  Project: invitro-code
  Vision: Interactive learning platform (Duolingo-style) for biotech students to learn AI/ML fundamentals through coding challenges.
  Stack: Next.js 16 (App Router, Turbopack), TypeScript, Tailwind v4, MDX (next-mdx-remote/rsc), Plotly.js, Monaco Editor, Supabase (auth/DB), Clerk auth
  Architecture: Content-driven — modules (python, ia, estadistica, etica, machine-learning) with lesson.md files containing MDX components (<Section>, <ConceptCard>, etc.). Lesson page splits by <Section> blocks into a carousel.
  Testing: Vitest configured (vitest.config.mts, Node env). `npm run test` runs 6 unit test files / 37 tests. No coverage/e2e.
  Strict TDD: false (tests optional for SDD flows)
  Style: Next.js App Router patterns; MDX components in src/components/lesson/; content in src/content/modules/; Spanish-language educational content

rules:
  proposal:
    - Include rollback plan for risky changes
    - Document tradeoffs explicitly
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep language accessible for a solo developer learning to program
  design:
    - Follow existing component patterns in src/components/lesson/
    - Document architecture decisions with rationale
  tasks:
    - Group by lesson, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing MDX component patterns (Section, ConceptCard, InteractiveTable, etc.)
      - Content must remain in Spanish
      - Preserve LaTeX math (remark-math + rehype-katex)
    tdd: false
    test_command: "npm run test"
  verify:
    type-check: "npm run type-check"
    build: "npm run build"
    test_command: "npm run test"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner:
    available: true
    framework: vitest
    command: "npm run test"
  layers:
    unit: { available: true, tool: vitest }
    integration: { available: false, tool: null }
    e2e: { available: false, tool: null }
  coverage:
    available: true
    command: "npm run test -- --coverage"
    note: "Configured via @vitest/coverage-v8 (v8 provider, text+lcov). Run `npm run test -- --coverage` for report."
  quality:
    linter: { available: false, command: "npm run lint", note: "Broken by design: Next 16 removed the next lint CLI and the repo has no eslint config; do not add one unless asked." }
    type_checker: { available: true, command: "npm run type-check" }
    formatter: { available: false, command: null }
  note: >
    Vitest is configured (vitest.config.mts) and `npm run test` runs 6 unit test files /
    37 tests (Node environment, all green). The include pattern also covers
    src/**/*.test.mjs, so requestId-descarte.test.mjs runs as a real Vitest test.
    No current test needs a DOM (all six suites are pure logic), so the default
    environment stays `node`; component tests needing a DOM will require the jsdom
    devDependency plus a Vitest `projects` split (environmentMatchGlobs was removed
    in Vitest 4). Strict TDD stays disabled: SDD flows don't require tests,
    but planned work can reference the existing vitest suite. MDX lesson components
    and patterns exist and work.
