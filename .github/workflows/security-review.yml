name: Security Review (Claude Code)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    # Only run when secret is configured - otherwise skip gracefully
    if: ${{ secrets.CLAUDE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Security Review
        uses: anthropics/claude-code-security-review@v1
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          upload-results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback note if secret missing (job skipped, this won't run either - docs only)
      - name: Check secret configured
        if: ${{ secrets.CLAUDE_API_KEY == '' }}
        run: echo "CLAUDE_API_KEY not set - security review skipped. Configure in repo Settings > Secrets."
